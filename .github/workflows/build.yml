name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Arrange sources
        run: |
          mkdir -p Sources
          if ls *.swift >/dev/null 2>&1; then mv *.swift Sources/; fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project GazouGen.xcodeproj -scheme GazouGen -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GazouGen.app Payload/
          zip -qr GazouGen.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GazouGen-ipa
          path: GazouGen.ipa
